# Render Blueprint: the SketchOn server as one web service.
# In Render, choose New > Blueprint and pick this repository. Fill in the four secrets when
# asked; they are never stored in this file or in git.
services:
  - type: web
    name: sketchon
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: node src/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FAL_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
