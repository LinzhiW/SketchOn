<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>戒指草图实时渲染测试</title>
<style>
  :root {
    --bg: #f4f3f0; --panel: #ffffff; --ink: #1d1c1a; --muted: #6d6a64; --line: #dedad3;
    --accent: #a8762a; --accent-ink: #ffffff; --bad: #b3261e; --ok: #2f6f3e; --canvas: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161514; --panel: #201f1d; --ink: #efece6; --muted: #a29e96; --line: #36332f;
      --accent: #d6a24e; --accent-ink: #1d1c1a; --bad: #f2867e; --ok: #8fd19e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif; }
  header { padding: 16px 20px 4px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 12px 20px;
    border-bottom: 1px solid var(--line); }
  .bar label { display: inline-flex; gap: 6px; align-items: center; }
  select, input[type=number] { font: inherit; padding: 4px 6px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--panel); color: var(--ink); }
  input[type=number] { width: 120px; }
  button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); cursor: pointer; }
  button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding: 16px 20px 32px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card h2 { font-size: 15px; margin: 0; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .square { position: relative; width: 100%; aspect-ratio: 1; border-radius: 8px; overflow: hidden;
    border: 1px solid var(--line); background: var(--canvas); }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  .square img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .square .empty { position: absolute; inset: 0; display: grid; place-items: center; color: #8a867f;
    text-align: center; padding: 20px; }
  .busy { position: absolute; top: 8px; right: 8px; font-size: 12px; padding: 2px 8px; border-radius: 999px;
    background: rgba(0,0,0,.6); color: #fff; display: none; }
  .busy.show { display: block; }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; color: var(--muted); font-size: 13px; }
  .stats b { color: var(--ink); font-weight: 600; }
  .err { color: var(--bad); margin-top: 6px; font-size: 13px; min-height: 1.5em; word-break: break-word; }
  .note { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>戒指草图实时渲染测试</h1>
  <p>在左边画戒指，中间的 Klein 边画边出图；画满意了，点右边“精修一张”用 Nano Banana 出一张更忠实的。</p>
</header>

<div class="bar">
  <button id="live" class="on" title="关掉后画画不会花钱">实时出图：开</button>
  <label>材质
    <select id="style">
      <option value="gold">黄金</option>
      <option value="silver">银</option>
      <option value="rose">玫瑰金</option>
      <option value="platinum">铂金 + 小钻</option>
      <option value="clay">黏土</option>
      <option value="resin">树脂</option>
    </select>
  </label>
  <label>随机种子 <input id="seed" type="number" min="0" max="2147483647"></label>
  <button id="reseed">换一个</button>
  <button id="once" class="primary">手动出一张</button>
  <span id="total" class="note"></span>
</div>

<main>
  <section class="card">
    <div class="head"><h2>草图</h2></div>
    <div class="square"><canvas id="pad" width="512" height="512"></canvas></div>
    <div class="tools">
      <button id="pen" class="on">笔</button>
      <button id="eraser">橡皮</button>
      <label>粗细 <input id="width" type="range" min="2" max="24" value="6"></label>
      <button id="undo">撤销</button>
      <button id="clear">清空</button>
    </div>
    <p class="note">画的时候大约每 0.3 秒发一次；上一张没回来就先不发，抬笔时一定再发一次最新的。</p>
  </section>

  <section class="card" data-engine="klein" data-live="1">
    <div class="head">
      <h2>FLUX.2 Klein（边画边出）</h2>
      <button class="toggle on">开</button>
    </div>
    <div class="square"><div class="empty">还没有图</div><img alt="" hidden><span class="busy">生成中…</span></div>
    <div class="stats"><span>上一张 <b class="ms">–</b></span><span>平均 <b class="avg">–</b></span><span>张数 <b class="count">0</b></span><span>约 <b class="cost">$0.000</b></span></div>
    <div class="err"></div>
  </section>

  <section class="card" data-engine="nano">
    <div class="head">
      <h2>Nano Banana 2（精修）</h2>
      <button class="refine primary">精修一张</button>
    </div>
    <div class="square"><div class="empty">还没有图</div><img alt="" hidden><span class="busy">生成中…</span></div>
    <div class="stats"><span>上一张 <b class="ms">–</b></span><span>平均 <b class="avg">–</b></span><span>张数 <b class="count">0</b></span><span>约 <b class="cost">$0.000</b></span></div>
    <div class="err"></div>
  </section>
</main>

<script>
(() => {
  // Klein is $0.01 per megapixel at 512 x 512; Nano Banana 2 is $0.08 an image.
  const PRICE = { klein: 0.01 * (512 * 512) / 1e6, nano: 0.08 };
  const SEND_EVERY_MS = 300;

  const pad = document.getElementById("pad");
  const ctx = pad.getContext("2d");
  const $ = (id) => document.getElementById(id);

  let live = true, tool = "pen", drawing = false, lastPoint = null;
  const history = [];

  function blank() {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, pad.width, pad.height);
  }
  blank();

  function newSeed() { $("seed").value = Math.floor(Math.random() * 2147483647); }
  newSeed();

  // ---- drawing ----
  function point(e) {
    const r = pad.getBoundingClientRect();
    return { x: (e.clientX - r.left) * pad.width / r.width, y: (e.clientY - r.top) * pad.height / r.height };
  }
  pad.addEventListener("pointerdown", (e) => {
    pad.setPointerCapture(e.pointerId);
    history.push(ctx.getImageData(0, 0, pad.width, pad.height));
    if (history.length > 30) history.shift();
    drawing = true;
    lastPoint = point(e);
    stroke(lastPoint, lastPoint);
  });
  pad.addEventListener("pointermove", (e) => {
    if (!drawing) return;
    const p = point(e);
    stroke(lastPoint, p);
    lastPoint = p;
    changed(false);
  });
  const end = () => { if (!drawing) return; drawing = false; changed(true); };
  pad.addEventListener("pointerup", end);
  pad.addEventListener("pointercancel", end);

  function stroke(a, b) {
    ctx.strokeStyle = tool === "pen" ? "#111111" : "#ffffff";
    ctx.lineWidth = Number($("width").value) * (tool === "pen" ? 1 : 3);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  $("pen").onclick = () => { tool = "pen"; $("pen").classList.add("on"); $("eraser").classList.remove("on"); };
  $("eraser").onclick = () => { tool = "eraser"; $("eraser").classList.add("on"); $("pen").classList.remove("on"); };
  $("undo").onclick = () => { const s = history.pop(); if (s) { ctx.putImageData(s, 0, 0); changed(true); } };
  $("clear").onclick = () => { history.push(ctx.getImageData(0, 0, pad.width, pad.height)); blank(); };

  // ---- sending ----
  const engines = {};
  for (const card of document.querySelectorAll("[data-engine]")) {
    const name = card.dataset.engine;
    engines[name] = {
      name, card, on: true, live: card.dataset.live === "1", busy: false, dirty: false, lastSent: 0, times: [], count: 0,
      img: card.querySelector("img"), empty: card.querySelector(".empty"), badge: card.querySelector(".busy"),
      err: card.querySelector(".err"),
    };
    const refine = card.querySelector(".refine");
    if (refine) refine.onclick = () => { if (!engines[name].busy) send(engines[name]); };
    const btn = card.querySelector(".toggle");
    if (btn) btn.onclick = () => {
      const e = engines[name];
      e.on = !e.on;
      btn.textContent = e.on ? "开" : "关";
      btn.classList.toggle("on", e.on);
    };
  }

  $("live").onclick = () => {
    live = !live;
    $("live").textContent = live ? "实时出图：开" : "实时出图：关";
    $("live").classList.toggle("on", live);
  };
  $("reseed").onclick = () => { newSeed(); changed(true); };
  $("style").onchange = () => changed(true);
  $("once").onclick = () => { for (const e of Object.values(engines)) if (e.on && e.live && !e.busy) send(e); };

  function isBlank() {
    const d = ctx.getImageData(0, 0, pad.width, pad.height).data;
    for (let i = 0; i < d.length; i += 4 * 7) if (d[i] < 240) return false;
    return true;
  }

  // final = the stroke ended, so the latest drawing must be sent even if it waits for a busy engine.
  function changed(final) {
    if (!live) return;
    const now = performance.now();
    for (const e of Object.values(engines)) {
      if (!e.on || !e.live) continue;
      if (e.busy) { e.dirty = e.dirty || final; continue; }
      if (final || now - e.lastSent >= SEND_EVERY_MS) send(e);
    }
  }

  async function send(e) {
    if (isBlank()) return;
    e.busy = true; e.dirty = false; e.lastSent = performance.now();
    e.badge.classList.add("show");
    const seedText = $("seed").value.trim();
    const body = {
      sketch: pad.toDataURL("image/png"),
      material: $("style").value,
      engine: e.name,
      ...(seedText === "" ? {} : { seed: Number(seedText) }),
    };
    const started = performance.now();
    try {
      const res = await fetch("/api/render", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + (localStorage.getItem("sketchonToken") || "") },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      const total = Math.round(performance.now() - started);
      e.img.src = data.imageUrl; e.img.hidden = false; e.empty.hidden = true;
      e.count++; e.times.push(total); if (e.times.length > 20) e.times.shift();
      e.card.querySelector(".ms").textContent = `${total} 毫秒`;
      e.card.querySelector(".avg").textContent =
        `${Math.round(e.times.reduce((a, b) => a + b, 0) / e.times.length)} 毫秒`;
      e.card.querySelector(".count").textContent = e.count;
      const cost = e.card.querySelector(".cost");
      if (cost) cost.textContent = `$${(e.count * PRICE[e.name]).toFixed(3)}`;
      e.err.textContent = "";
      updateTotal();
    } catch (err) {
      e.err.textContent = `出错：${explain(err.message)}`;
    } finally {
      e.busy = false;
      e.badge.classList.remove("show");
      if (e.dirty && live && e.on && e.live) send(e);
    }
  }

  function explain(msg) {
    if (/balance|locked|top.?up/i.test(msg)) return "fal 余额不足，请先充值。（" + msg + "）";
    if (/Failed to fetch/i.test(msg)) return "连不上本地服务器，检查它是不是还开着。";
    return msg;
  }

  function updateTotal() {
    const n = Object.values(engines).reduce((a, e) => a + e.count, 0);
    $("total").textContent = `本次共出图 ${n} 张`;
  }
})();
</script>
</body>
</html>
